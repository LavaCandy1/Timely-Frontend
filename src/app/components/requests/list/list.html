<div class="listContainer">

    @for (request of requests; track $index) {
    <div class="requestItem">
        <h4
            (click)="openRequest(request.id)"
        >{{request.name}}</h4>
        
        @if(openedRequestId() === request.id) {
        <p>{{request.description}}</p>
        }
    </div>
    }

</div>
