<div class="sidebar">
  <div class="sidebar-main">
    <!-- Top Section -->
    <div class="upper-items">
      <div class="sidebar-item">
        <i class="fas fa-user"></i>
      </div>

      <div class="divider"></div>

      <div class="sidebar-item text-item">
        <span>{{ today | date : 'EEE' }}</span>
        <span>{{ today | date : 'dd' }}/{{ today | date : 'MM' }}</span>
      </div>

      <div class="divider"></div>

      @if (userRole==="ADMIN") {
      <div class="sidebar-item" (click)="toggleSearch()">
        <i class="fas" [ngClass]="isOpen ? 'fa-chevron-left' : 'fa-search'"></i>
      </div>

      <div class="divider"></div>
      }
    </div>

    <div class="brand">Timely</div>

    <!-- Bottom Section -->
    <div class="lower-items">
      <div class="divider"></div>
      <div class="sidebar-item">
        <i class="fas fa-moon"></i>
      </div>

      <div class="divider"></div>

      <div class="sidebar-item" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i>
      </div>
    </div>
  </div>

  @if (userRole==="ADMIN" && isOpen) {
  <div class="search" [ngClass]="{ open: isOpen && userRole === 'ADMIN' }" animate.enter="searchOpen"
    animate.leave="searchClose">

    <div class="search-box">
      <h3>Search Timetable</h3>

      <form class="formItems" (ngSubmit)="searchTimetable()">
        <!-- Search type -->
        <div class="form-group">
          <label for="searchType">Search by:</label>
          <select id="searchType" [(ngModel)]="searchType" name="searchType">
            <option value="teacher">Teacher</option>
            <option value="batch">Batch</option>
          </select>
        </div>

        <!-- Conditional fields -->
        @if (searchType === 'teacher') {

        <div class="form-group">
          <label for="teacherName">Teacher Name:</label>
          <input id="teacherName" [(ngModel)]="teacherName" name="teacherName" type="text"
            placeholder="Enter teacher name" />
        </div>
        }
        <!-- <button type="submit" class="search-item" (click)="searchTimetable()">
          <i class="fas fa-search"></i>
        </button> -->
        @if (searchType === 'batch') {
        <div class="form-group batch-fields">
          <label for="year">Year:</label>
          <input id="year" type="text" [(ngModel)]="year" name="year" placeholder="e.g., 1st, 2nd" />

          <label for="batch">Batch:</label>
          <input id="batch" [(ngModel)]="batch" name="batch" type="text" placeholder="e.g., A, B, C" />
        </div>
        }
        <button type="submit" class="search-item" (click)="searchTimetable(); changeView('timetable')">
          <i class="fas fa-search"></i>
        </button>

      </form>
    </div>
    <div class="request-box">
      <h3>Requests Lookup</h3>
      <button class="sidebar-item" (click)="changeView('requests')">
        <i class="fas fa-arrow-right"></i>
      </button>
    </div>
  </div>
  }
</div>
