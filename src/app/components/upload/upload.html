<div class="upload-container">
    <form class="add-class-form" (ngSubmit)="onSubmit($event)" #uploadForm="ngForm">

        <h3>Upload File</h3>

        <div class="form-grid">

            <!-- Dropdown -->
            <select name="uploadType" [(ngModel)]="uploadType" required>
                <option value="" disabled selected>Select upload type</option>
                <option value="timetable">Timetable</option>
                <option value="students">Students</option>
                <option value="locations">Locations</option>
            </select>

            <!-- File Input -->
            <div class="file-input-wrapper">
                <input #fileInput type="file" multiple accept="application/pdf" (change)="onFileSelected($event)" />

                <span class="file-name">
                    {{
                    selectedFiles.length
                    ? selectedFiles.length + ' file(s) selected'
                    : getUploadLabel()
                    }}
                </span>

                <!-- Optional: show file names -->
                <div class="file-list" *ngIf="selectedFiles.length">
                    <div *ngFor="let file of selectedFiles; let i = index">
                        {{ file.name }}
                    </div>
                </div>
            </div>

        </div>

        <!-- Warning -->
        <div class="warning-text" *ngIf="warning">
            {{ warning }}
        </div>

        <div class="form-actions">
            <button type="button" class="cancel-btn" (click)="onCancel(fileInput)">
                Cancel
            </button>
            <button type="submit" class="submit-btn">
                Submit
            </button>
        </div>

    </form>
</div>
